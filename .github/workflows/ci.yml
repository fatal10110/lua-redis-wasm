name: ci

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    # A hang in synchronous WASM code (e.g. a reply-encoding regression) must
    # fail the job instead of running until the 6h default.
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build WASM (Docker)
        run: ./wasm/build/docker-build.sh

      - name: Smoke tests (native C, Docker)
        run: ./wasm/build/docker-test.sh

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install deps
        run: npm ci

      # The browser-bundle test imports dist/index.browser.mjs.
      - name: Build TypeScript
        run: npm run build:ts

      # WASM is already built above, so skip the docker rebuild inside `test`.
      - name: Tests
        run: npm run test:skip-wasm
